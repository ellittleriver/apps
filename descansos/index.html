<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B7181">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Descansos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Descansos en vuelo</title>
<style>
@font-face{font-family:"B612";font-weight:400;font-style:normal;font-display:swap;src:url("b612-400.woff2") format("woff2")}
@font-face{font-family:"B612";font-weight:700;font-style:normal;font-display:swap;src:url("b612-700.woff2") format("woff2")}
@font-face{font-family:"B612 Mono";font-weight:400;font-style:normal;font-display:swap;src:url("b612-mono-400.woff2") format("woff2")}
@font-face{font-family:"B612 Mono";font-weight:700;font-style:normal;font-display:swap;src:url("b612-mono-700.woff2") format("woff2")}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: an Airbus-style panel — screwed plates with white placards and group lines, dark push buttons
   with lit legends, black display windows. Single deliberate look: cockpit blue-grey in both themes.
   Display colour logic: cyan = pilot entries, green = computed rest, white = labels, amber = gaps/caution. */
:root{
  color-scheme:dark;
  --bg:#5B7181;
  --plate:#677D8D;
  --plate-hi:#8195A3;
  --plate-edge:#465966;
  --screw:#AEBBC4;
  --screw-edge:#3A4B56;
  --ink:#FFFFFF;
  --ink-dim:#D5DDE3;
  --line:#E9EEF1;
  --win:#050709;
  --win-edge:#252E34;
  --bezel:#1E2428;
  --pb:#2A2E31;
  --pb-top:#454A4F;
  --pb-edge:#101214;
  --leg-off:#5E656B;
  --leg-name:#B9C2C8;
  --leg-on:#F6F8F9;
  --lit-blue:#45B2FF;
  --lit-glow:rgba(69,178,255,.6);
  --cyan:#33D2F2;
  --green:#42E07E;
  --sel:#8FD8A6;
  --g-soft:#0D2617;
  --amber:#FFA81A;
  --white:#F2F4F5;
  --disp-dim:#8E9AA2;
  --disp-line:#1C252B;
  --disp-hover:#0C1317;
  --hatch:#36424A;
  --haz-y:#F0BE2C;
  --haz-k:#1B1D1F;
  --hinge:#16181A;
  --well-1:#5E6A72;
  --well-2:#46515A;
  --knob:#A9B2B8;
  --knob-hi:#E3E8EB;
  --knob-red:#C42A2A;
  --glass-1:rgba(232,240,244,.42);
  --glass-2:rgba(170,186,196,.26);
  --glass-edge:rgba(255,255,255,.5);
  --shade:rgba(0,0,0,.45);
  --scrim:rgba(5,8,11,.9);
  --ecam-edge:#3A444B;
  --ecam-red:#FF3B30;
  --mw:#C8161D;
  --mw-edge:#5A0B0B;
  --key:#2A3137;
  --key-edge:#4A545B;
  --font-ui:"B612","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-num:"B612 Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:2px;padding-block:4px}
.eyebrow{margin:0;font-family:var(--font-num);font-size:12px;letter-spacing:.16em;color:var(--ink-dim)}
h1{margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
button{font-family:var(--font-ui)}
input:focus-visible,button:focus-visible{outline:2px solid var(--white);outline-offset:2px}

/* plates */
.plate{position:relative;background-color:var(--plate);border:1px solid var(--plate-edge);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:inset 0 1px 0 var(--plate-hi),0 2px 0 var(--plate-edge);
  background-image:radial-gradient(circle,var(--screw) 0 1.8px,var(--screw-edge) 2.2px 3px,transparent 3.4px),radial-gradient(circle,var(--screw) 0 1.8px,var(--screw-edge) 2.2px 3px,transparent 3.4px),radial-gradient(circle,var(--screw) 0 1.8px,var(--screw-edge) 2.2px 3px,transparent 3.4px),radial-gradient(circle,var(--screw) 0 1.8px,var(--screw-edge) 2.2px 3px,transparent 3.4px);
  background-size:8px 8px;background-repeat:no-repeat;background-position:5px 5px,calc(100% - 5px) 5px,5px calc(100% - 5px),calc(100% - 5px) calc(100% - 5px)}
.grp{margin:0;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--ink)}
.grp::before,.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.chip{font-family:var(--font-num);font-size:10px;letter-spacing:.08em;font-weight:400;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--ink-dim)}
.plc{font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--ink);text-transform:uppercase}

/* display windows */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.win{font-family:var(--font-num);background:var(--win);border:2px solid var(--win-edge);border-radius:4px;box-shadow:inset 0 2px 5px #000;color:var(--cyan)}
input[type=time].win{font-size:26px;min-height:54px;padding:8px 10px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input::-webkit-date-and-time-value{text-align:left}
.ftrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.win.sm{display:inline-flex;align-items:baseline;gap:5px;font-size:18px;padding:4px 10px;color:var(--green);font-variant-numeric:tabular-nums}
.nd{font-size:12px;color:var(--amber)}

/* push buttons */
.pbrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px;padding:8px 6px;background:linear-gradient(var(--pb-top),var(--pb) 40%);border:2px solid var(--pb-edge);border-radius:4px;box-shadow:0 3px 0 var(--pb-edge);color:var(--leg-name);cursor:pointer;transition:transform .06s,box-shadow .06s;min-width:0}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pb-edge)}
.pb .leg{font-size:14px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.pb .val{font-family:var(--font-num);font-size:11px;color:var(--leg-name)}
.pb .on{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--leg-off)}
.pb[aria-pressed="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel),0 3px 0 var(--pb-edge)}
.pb[aria-pressed="true"] .leg{color:var(--leg-on)}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.pbs{width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(var(--pb-top),var(--pb) 40%);border:2px solid var(--pb-edge);border-radius:4px;box-shadow:0 3px 0 var(--pb-edge);color:var(--leg-on);font-family:var(--font-num);font-size:20px;line-height:1;cursor:pointer;transition:transform .06s,box-shadow .06s}
.pbs:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pb-edge)}
.win.num{width:60px;height:40px;text-align:center;font-size:18px;padding:0;-moz-appearance:textfield;appearance:textfield}
.win.num::-webkit-inner-spin-button,.win.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--ink-dim)}

/* result display */
.disp{background:var(--win);border:3px solid var(--win-edge);border-radius:8px;box-shadow:0 0 0 4px var(--bezel),0 6px 0 4px var(--plate-edge);padding:14px;margin:4px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dtitle{margin:0;font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--white);text-decoration:underline;text-underline-offset:4px}
.derr{margin:0;font-family:var(--font-num);font-size:15px;color:var(--amber)}
.per{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.per .lbl{font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--white)}
.big{font-family:var(--font-num);font-size:44px;line-height:1;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.strip{display:flex;height:30px;border-radius:3px;overflow:hidden;border:1px solid var(--disp-line)}
.strip > span{flex-basis:0;min-width:0;transition:flex-grow .25s ease}
.bk{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px)}
.rt{background:var(--g-soft);border-inline:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700;color:var(--green);font-size:13px}
.rt.mine{background:var(--green);color:var(--win)}
.hg{background:var(--amber);min-width:2px !important}
.ends{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-num);font-size:12px;color:var(--green);font-variant-numeric:tabular-nums}
.ends sup{font-size:9px;color:var(--green);margin-left:2px}
.sw{position:relative}
.tk{position:absolute;top:-7px;bottom:-7px;width:3px;background:var(--green);border-radius:2px}
.tk-l{left:-5px}
.tk-r{right:-5px}
.times sup{font-size:10px;color:var(--amber);margin-left:2px}
.turns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.turns li{border-top:1px solid var(--disp-line);padding-block:6px}
.tsel{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--white);cursor:pointer;text-align:left}
.tsel:hover{background:var(--disp-hover)}
.mine .tsel{border-color:var(--green)}
.tn{width:32px;height:32px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:14px}
.mine .tn{background:var(--green);color:var(--win)}
.times{font-family:var(--font-num);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.times .arr{color:var(--disp-dim);padding-inline:4px}
.dur{font-family:var(--font-num);font-size:17px;color:var(--green);font-variant-numeric:tabular-nums}
input[type=text].win{font-size:26px;min-height:54px;padding:8px 10px;width:100%;min-width:0}
input[type=time].win.ftin{width:140px;font-size:22px;min-height:44px;padding:4px 10px}
.win.calc{color:var(--green)}
.disp{cursor:pointer}
.key.fsx{align-self:flex-end;padding:8px 18px;font-size:14px}
.disp.full{position:fixed;inset:0;z-index:60;margin:0;border:0;border-radius:0;box-shadow:none;overflow:auto;gap:22px;cursor:default;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.disp.full .big{font-size:64px}
.disp.full .times{font-size:28px}
.disp.full .dur{font-size:22px}
.disp.full .tn{width:40px;height:40px;font-size:18px}
.disp.full .strip{height:44px}
.disp.full .ends{font-size:15px}
.disp.full .dtitle{font-size:18px}

/* guarded switch */
.gx{align-self:center;width:min(100%,280px);padding:14px 16px 18px}
.gx-title{color:var(--ink);font-size:19px;font-weight:400;letter-spacing:.06em;text-align:center}
.gx-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:stretch}
.gx-frame{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:10px;background:repeating-linear-gradient(-45deg,var(--haz-y) 0 11px,var(--haz-k) 11px 22px);perspective:600px}
.gx-frame::before,.gx-frame::after,.gx-bar{content:"";position:absolute;z-index:3;border-radius:5px;background:var(--hinge)}
.gx-frame::before{left:-3px;top:8%;width:9px;height:24%}
.gx-frame::after{left:-3px;bottom:8%;width:9px;height:24%}
.gx-bar{right:-3px;top:36%;width:9px;height:48%}
.gx-well{position:absolute;inset:11px;border-radius:6px;background:linear-gradient(var(--well-1),var(--well-2));display:grid;place-items:center;box-shadow:inset 0 2px 6px var(--shade)}
.gx-knob{position:relative;width:84%;height:18%;min-height:14px;padding:0;border:0;border-radius:5px;background:linear-gradient(90deg,var(--knob-red) 0 15%,var(--knob) 15% 85%,var(--knob-red) 85%);box-shadow:0 2px 3px var(--shade);transition:transform .25s ease;cursor:pointer}
.gx-hub{position:absolute;left:50%;top:50%;width:32%;aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,var(--knob-hi),var(--knob) 68%);box-shadow:0 1px 3px var(--shade)}
.gx.on .gx-knob{transform:rotate(-32deg)}
.gx:not(.open) .gx-knob{pointer-events:none}
.gx-guard{position:absolute;z-index:2;inset:6px;border:0;border-radius:8px;background:linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:inset 0 0 0 2px var(--glass-edge),0 4px 8px var(--shade);transform-origin:50% 0;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .45s;cursor:pointer}
.gx.open .gx-guard{transform:rotateX(80deg);opacity:.5;pointer-events:none}
.gx-labels{display:grid;grid-template-rows:1fr 1fr 1fr;align-items:center;color:var(--ink);font-size:14px;font-weight:400;letter-spacing:.04em}
.gx-labels span:first-child{align-self:end}

/* overlay */
.ovl{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovl-box{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(100%,360px)}
.mw{font-weight:700;font-size:16px;line-height:1.15;letter-spacing:.08em;color:var(--white);background:var(--mw);border:3px solid var(--mw-edge);border-radius:6px;padding:12px 22px;cursor:pointer;animation:blink .5s steps(2,start) infinite}
.mw.ack{animation:none;opacity:.55}
.ecam{width:100%;background:var(--win);border:2px solid var(--ecam-edge);border-radius:8px;padding:14px 16px;font-family:var(--font-num);font-size:16px;line-height:1.65}
.ecam div{white-space:pre}
.ecam .r{color:var(--ecam-red)}
.ecam .a{color:var(--amber)}
.ecam .c{color:var(--cyan)}
.key{font-weight:700;font-size:16px;letter-spacing:.1em;color:var(--white);background:var(--key);border:2px solid var(--key-edge);border-radius:6px;padding:10px 30px;cursor:pointer}
@keyframes blink{to{opacity:.3}}

@media (prefers-reduced-motion: reduce){
  .strip > span,.gx-knob,.gx-guard,.pb,.pbs{transition:none}
  .mw{animation:none}
}
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">CREW REST</p>
    <h1>Descansos en vuelo</h1>
  </header>

  <section class="plate" aria-labelledby="h-vuelo">
    <h2 id="h-vuelo" class="grp">VUELO <span id="exchip" class="chip">EJEMPLO</span></h2>
    <div class="row2">
      <label class="field" for="tko"><span class="plc">Despegue</span><input type="time" id="tko" class="win" required></label>
      <label class="field" for="ldg"><span class="plc">Aterrizaje <span id="nextday" class="nd" hidden>+1</span></span><input type="time" id="ldg" class="win" required></label>
    </div>
    <label class="ftrow" for="dur"><span class="plc">Tiempo de vuelo</span><input type="time" id="dur" class="win ftin" required></label>
    <div class="pbrow" role="group" aria-label="Número de turnos">
      <button type="button" class="pb" data-n="2" aria-pressed="false"><span class="leg">2 TURNOS</span></button>
      <button type="button" class="pb" data-n="3" aria-pressed="false"><span class="leg">3 TURNOS</span></button>
    </div>
  </section>

  <section class="plate" aria-labelledby="h-mar">
    <h2 id="h-mar" class="grp">MÁRGENES</h2>
    <div class="pbrow" role="group" aria-label="Perfiles de márgenes">
      <button type="button" class="pb preset" data-after="30" data-before="50" data-gap="15" aria-pressed="false"><span class="leg">📃 PAPEL</span><span class="val">30/50/15</span></button>
      <button type="button" class="pb preset" data-after="30" data-before="30" data-gap="5" aria-pressed="false"><span class="leg">⌨️ REAL</span><span class="val">30/30/5</span></button>
    </div>
    <div class="mrow">
      <span class="plc">T/O</span>
      <div class="stepper"><button type="button" class="pbs" data-for="after" data-d="-5" aria-label="Restar 5 min">−</button><input type="number" id="after" class="win num" inputmode="numeric" min="0" max="600" step="5" aria-label="Margen tras despegue, minutos"><button type="button" class="pbs" data-for="after" data-d="5" aria-label="Sumar 5 min">+</button><span class="unit">MIN</span></div>
    </div>
    <div class="mrow">
      <span class="plc">LDG</span>
      <div class="stepper"><button type="button" class="pbs" data-for="before" data-d="-5" aria-label="Restar 5 min">−</button><input type="number" id="before" class="win num" inputmode="numeric" min="0" max="600" step="5" aria-label="Margen antes de aterrizaje, minutos"><button type="button" class="pbs" data-for="before" data-d="5" aria-label="Sumar 5 min">+</button><span class="unit">MIN</span></div>
    </div>
    <div class="mrow">
      <span class="plc">Entre turnos</span>
      <div class="stepper"><button type="button" class="pbs" data-for="gap" data-d="-5" aria-label="Restar 5 min">−</button><input type="number" id="gap" class="win num" inputmode="numeric" min="0" max="600" step="5" aria-label="Margen entre turnos, minutos"><button type="button" class="pbs" data-for="gap" data-d="5" aria-label="Sumar 5 min">+</button><span class="unit">MIN</span></div>
    </div>
  </section>

  <section class="disp" id="disp" aria-labelledby="h-res">
    <h2 id="h-res" class="dtitle">REPARTO ⛶</h2>
    <button type="button" id="fsx" class="key fsx" hidden>CERRAR</button>
    <p id="err" class="derr" hidden></p>
    <div id="res">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div id="ends" class="ends" aria-hidden="true"></div>
        <div class="sw"><div id="strip" class="strip" aria-hidden="true"></div><span class="tk tk-l" aria-hidden="true"></span><span class="tk tk-r" aria-hidden="true"></span></div>
        <ol id="turns" class="turns"></ol>
      </div>
    </div>
  </section>

</main>

<script>
(function(){
  const KEY = 'descansos-vuelo-v1';
  const DEF = {tko:'10:30', ldg:'21:15', n:3, after:30, before:50, gap:15, mine:null, mode:'ldg', dur:'10:45'};
  let st = Object.assign({}, DEF), isExample = true;
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') { st = Object.assign({}, DEF, s); isExample = false; }
  } catch(e) {}
  ['round','ref','alarm'].forEach(k => delete st[k]);
  if (st.n !== 2 && st.n !== 3) st.n = 3;
  if (!(Number.isInteger(st.mine) && st.mine >= 0 && st.mine < st.n)) st.mine = null;
  if (st.mode !== 'dur') st.mode = 'ldg';
  if (typeof st.dur !== 'string') st.dur = DEF.dur;
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const toMin = v => { const m = /^(\d{1,2}):(\d{2})/.exec(v || ''); return m ? (+m[1]) * 60 + (+m[2]) : NaN; };
  const hm = x => Math.floor(x / 60) + ':' + pad(x % 60);
  const parseDur = v => { const s = (v || '').trim(); const m = /^(\d{1,2})[:.,hH ](\d{2})$/.exec(s) || /^(\d{1,2})(\d{2})$/.exec(s); if (!m || +m[2] >= 60) return null; const x = (+m[1]) * 60 + (+m[2]); return x >= 1 && x <= 1439 ? x : null; };
  const clock = abs => { const d = Math.floor(abs / 1440), m = abs - d * 1440; return {t: pad(Math.floor(m / 60)) + ':' + pad(m % 60), d}; };
  const sup = d => d > 0 ? '<sup>+' + d + '</sup>' : '';
  const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : Math.max(0, Math.min(600, n)); };

  function plan(tko, ldg, n, after, before, gap){
    let dur = ldg - tko; if (dur <= 0) dur += 1440;
    const avail = dur - after - before - gap * (n - 1);
    const per = avail > 0 ? Math.floor(avail / n) : 0;
    if (per <= 0) return {dur, ok:false};
    const leftover = avail - per * n;
    const turns = []; let t = tko + after;
    for (let i = 0; i < n; i++) { turns.push({s:t, e:t + per}); t += per + gap; }
    return {dur, ok:true, per, leftover, turns};
  }

  /* ---------- sound ---------- */
  let ac = null, snd = null;
  function audio(){
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch(e) {}
  }
  function tone(f, d, type, vol){
    if (!ac) return;
    try {
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + d + 0.05);
    } catch(e) {}
  }
  function stopSound(){ if (snd) { clearInterval(snd); snd = null; } }
  function loop(fn, ms, max){
    stopSound(); fn();
    const t0 = Date.now();
    snd = setInterval(() => { if (Date.now() - t0 > max) { stopSound(); return; } fn(); }, ms);
  }

  /* ---------- controls ---------- */
  { const d0 = parseDur(st.dur); st.dur = d0 === null ? DEF.dur : pad(Math.floor(d0 / 60)) + ':' + pad(d0 % 60); }
  $('tko').value = st.tko; $('ldg').value = st.ldg; $('dur').value = st.dur;
  ['after','before','gap'].forEach(k => $(k).value = st[k]);
  $('exchip').hidden = !isExample;

  function render(){
    document.querySelectorAll('[data-n]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === st.n)));
    document.querySelectorAll('.preset').forEach(b => b.setAttribute('aria-pressed',
      String(+b.dataset.after === st.after && +b.dataset.before === st.before && +b.dataset.gap === st.gap)));

    const dur = st.mode === 'dur';
    $('ldg').classList.toggle('calc', dur); $('dur').classList.toggle('calc', !dur);
    const calcEl = dur ? $('ldg') : $('dur');
    const tko = toMin(st.tko), d = dur ? parseDur(st.dur) : null;
    const ldg = dur ? (isNaN(tko) || d === null ? NaN : (tko + d) % 1440) : toMin(st.ldg);
    const err = $('err'), res = $('res');
    if (isNaN(tko) || isNaN(ldg)) {
      if (document.activeElement !== calcEl) calcEl.value = '';
      $('nextday').hidden = true;
      err.textContent = dur && d === null ? 'FALTA T. VUELO' : 'FALTAN DATOS DE HORA';
      err.hidden = false; res.hidden = true; return;
    }
    const p = plan(tko, ldg, st.n, st.after, st.before, st.gap);
    if (dur) st.ldg = pad(Math.floor(ldg / 60)) + ':' + pad(ldg % 60);
    else st.dur = pad(Math.floor(p.dur / 60)) + ':' + pad(p.dur % 60);
    if (document.activeElement !== calcEl) calcEl.value = dur ? st.ldg : st.dur;
    $('nextday').hidden = !(ldg <= tko);
    if (!p.ok) { err.textContent = 'MÁRGENES > TIEMPO DE VUELO'; err.hidden = false; res.hidden = true; return; }
    err.hidden = true; res.hidden = false;

    let s = '<span class="bk" style="flex-grow:' + st.after + '"></span>';
    p.turns.forEach((t, i) => {
      if (i > 0 && st.gap > 0) s += '<span class="hg" style="flex-grow:' + st.gap + '"></span>';
      s += '<span class="rt' + (st.mine === i ? ' mine' : '') + '" style="flex-grow:' + p.per + '">' + (i + 1) + '</span>';
    });
    s += '<span class="bk" style="flex-grow:' + (st.before + p.leftover) + '"></span>';
    $('strip').innerHTML = s;

    const a = clock(tko), b = clock(tko + p.dur);
    $('ends').innerHTML = '<span>T/O ' + a.t + '</span><span>LDG ' + b.t + sup(b.d) + '</span>';

    $('turns').innerHTML = p.turns.map((t, i) => {
      const cs = clock(t.s), ce = clock(t.e), mine = st.mine === i;
      return '<li' + (mine ? ' class="mine"' : '') + '>' +
        '<button type="button" class="tsel" data-i="' + i + '" aria-pressed="' + mine + '" aria-label="Turno ' + (i + 1) + '">' +
          '<span class="tn">' + (i + 1) + '</span>' +
          '<span class="times">' + cs.t + sup(cs.d) + '<span class="arr">→</span>' + ce.t + sup(ce.d) + '</span>' +
          '<span class="dur">' + hm(t.e - t.s) + '</span>' +
        '</button></li>';
    }).join('');
  }

  function touched(){ if (isExample) { isExample = false; $('exchip').hidden = true; } render(); save(); }

  ['tko','ldg','dur'].forEach(k => ['input','change'].forEach(ev => $(k).addEventListener(ev, () => {
    st[k] = $(k).value; if (k !== 'tko') st.mode = k; touched();
  })));
  ['ldg','dur'].forEach(k => $(k).addEventListener('focus', () => {
    if (st.mode !== k) { st.mode = k; st[k] = $(k).value; touched(); }
  }));
  document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => {
    st.n = +b.dataset.n;
    if (st.mine !== null && st.mine >= st.n) st.mine = null;
    touched();
  }));
  document.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => {
    ['after','before','gap'].forEach(k => { st[k] = +b.dataset[k]; $(k).value = st[k]; });
    touched();
  }));
  ['after','before','gap'].forEach(k => $(k).addEventListener('input', () => { st[k] = num($(k).value); touched(); }));
  ['after','before','gap'].forEach(k => $(k).addEventListener('blur', () => { $(k).value = st[k]; }));
  document.querySelectorAll('.stepper .pbs').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.for; st[k] = num(st[k] + (+btn.dataset.d)); $(k).value = st[k]; touched();
  }));
  $('turns').addEventListener('click', e => {
    const sel = e.target.closest('.tsel'); if (!sel || !$('disp').classList.contains('full')) return;
    const i = +sel.dataset.i;
    st.mine = st.mine === i ? null : i;
    save(); render();
  });

  /* ---------- full-screen result ---------- */
  const disp = $('disp');
  function openFull(){
    if (disp.classList.contains('full')) return;
    disp.classList.add('full'); $('fsx').hidden = false;
    try { const p = disp.requestFullscreen && disp.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch(e) {}
  }
  function closeFull(){
    disp.classList.remove('full'); $('fsx').hidden = true;
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e) {}
  }
  disp.addEventListener('click', e => { if (e.target.closest('#fsx')) return; openFull(); });
  $('fsx').addEventListener('click', closeFull);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && disp.classList.contains('full')) closeFull(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFull(); });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
